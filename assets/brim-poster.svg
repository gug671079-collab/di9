<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680" preserveAspectRatio="none" role="img" aria-labelledby="poster-name">
  <title id="poster-name">云朵分院帽，帽檐掀起拱形的五个大字</title>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="3" cy="3" r="1.85" fill="#20204e"/>
    </pattern>
    <path id="recoil" d="M363 460C342 497 250 497 233 538C211 591 323 596 344 552C363 512 291 526 259 560C226 596 174 627 140 608C114 593 117 570 141 566C163 562 170 581 147 601C112 632 63 632 28 654"/>
    <style>
      .title-ink,.hat-ink,.spring-ink,.impact { transform-box:view-box; }
      @media (prefers-reduced-motion:no-preference) {
        .title-ink { transform-origin:58% 34%; animation:lift-letters 1.1s ease-out both; }
        .hat-ink { transform-origin:44% 72%; animation:lift-hat 1.1s ease-out both; }
        .spring-ink { transform-origin:33% 88%; animation:release .95s ease-out both; }
        .impact { transform-origin:90% 39%; animation:crack .86s ease-out both; }
      }
      @keyframes lift-letters { 0%,22% {transform:translateY(12px) rotate(1.7deg)} 48% {transform:translateY(-8px) rotate(-1.3deg)} 72% {transform:translateY(2px) rotate(.3deg)} 100% {transform:none} }
      @keyframes lift-hat { 0% {transform:translate(-5px,13px) rotate(-3deg) scale(1.025,.95)} 20% {transform:translate(-5px,16px) rotate(-4deg) scale(1.045,.93)} 50% {transform:translate(2px,-8px) rotate(1.8deg) scale(.98,1.025)} 76% {transform:translate(-1px,2px) rotate(-.4deg)} 100% {transform:none} }
      @keyframes release { 0%,20% {transform:scale(1.03,.87)} 56% {transform:scale(.98,1.05)} 100% {transform:none} }
      @keyframes crack { 0%,20% {opacity:0;transform:scale(.5)} 53% {opacity:1;transform:scale(1.14)} 100% {opacity:1;transform:none} }
    </style>
  </defs>

  <!-- The spring is a continuation of the brim, crossing in front of its own echo. -->
